[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eldoctor"
dynamic = ["version"]               # single source: eldoctor/__init__.py
description = "El Doctor - system monitoring, threat detection (Sigma, IOC, YARA, MITRE ATT&CK) and SOAR-style automated response"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "El Doctor contributors"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: X11 Applications",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: System :: Monitoring",
]
requires-python = ">=3.9"
dependencies = [
  "psutil>=5.9",
  "PyYAML>=6.0",
  "cryptography>=41",
  "windows-curses>=2.3; sys_platform == 'win32'",
]

[project.optional-dependencies]
yara = ["yara-python>=4.3"]
dev = ["pytest>=7"]

[project.scripts]
eldoctor = "eldoctor.cli:main"

[project.gui-scripts]
eldoctor-gui = "eldoctor.ui.launch:main"      # windowed launcher: no console window on Windows

[tool.setuptools.dynamic]
version = {attr = "eldoctor.__version__"}

[tool.setuptools.packages.find]
include = ["eldoctor*"]

[tool.setuptools.package-data]
eldoctor = ["data/*.yaml", "data/playbooks/*.yml", "data/rules/sigma/*/*.yml", "data/rules/yara/*.yar", "data/iocs/*.csv",
            "data/icons/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

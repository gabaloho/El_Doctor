title: Secure Deletion or Disk Wipe Tool Executed
id: 7c1e9a52-3b4d-4e6f-9a81-2d5c6e7f8a02
status: stable
description: >
  SDelete, cipher /w (free-space wipe), format of a volume, recursive forced deletion of user profiles or
  a whole drive, or a shadow-copy free wipe utility. Data destruction or evidence removal; the activity
  record shows which files were affected and by whom.
author: El Doctor
tags: [attack.impact, attack.t1485, attack.t1561.001, attack.defense-evasion, attack.t1070.004]
logsource: {category: process_creation, product: windows}
detection:
  sel_sdelete:
    Image|endswith: ['\sdelete.exe', '\sdelete64.exe', '\sdelete64a.exe']
  sel_cipher:
    Image|endswith: '\cipher.exe'
    CommandLine|contains: ['/w:', '/w ', '-w:']
  sel_format:
    CommandLine|re|i: '\bformat(\.com)?\s+[a-z]:(\s|$).*(/y|/q|/p:|/fs:)'
  sel_rd:
    CommandLine|re|i: '\b(rd|rmdir)\s+(/s\s+/q|/q\s+/s)\s+"?[a-z]:\\(users(\\[^\\\s"]+)?\\?)?"?(\s|$)'
  sel_ps:
    CommandLine|re|i: 'remove-item\s.*-recurse.*-force.*[a-z]:\\(users|\*|\s|$)|remove-item\s.*-force.*-recurse.*[a-z]:\\(users|\*|\s|$)'
  condition: 1 of sel_*
falsepositives:
  - Deliberate decommissioning of a machine
level: high

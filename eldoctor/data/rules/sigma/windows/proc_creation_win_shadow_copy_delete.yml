title: Shadow Copy Deletion or Recovery Disabled
id: 4b5c6d7e-8f90-41a2-83b4-c5d6e7f8a914
status: stable
description: vssadmin/wmic/wbadmin/bcdedit used to destroy backups - strong ransomware precursor.
author: El Doctor
tags: [attack.impact, attack.t1490]
logsource: {category: process_creation, product: windows}
detection:
  sel_vss:
    CommandLine|contains|all: ['vssadmin', 'delete', 'shadows']
  sel_wmic:
    CommandLine|contains|all: ['shadowcopy', 'delete']
  sel_wbadmin:
    CommandLine|contains|all: ['wbadmin', 'delete', 'catalog']
  sel_bcd:
    CommandLine|contains: ['recoveryenabled no', 'bootstatuspolicy ignoreallfailures']
  condition: 1 of sel_*
level: critical
